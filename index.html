<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presensi RFID | Politeknik Negeri Samarinda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===== POLNES ACADEMIC COMMAND CENTER & HARDWARE TELEMETRY ===== */
:root{
  --bg:#F4F7F6;--panel:#FFFFFF;--panel2:#F8FBFA;--in:#FFFFFF;
  --ink:#08241B;--mut:#53695F;--ln:#D6E2DC;--ln2:#B7CCC2;
  --grid:rgba(6,59,43,.055);
  --em:#10B981;--emd:#063B2B;--emt:#0A7A57;--gd:#C5A059;--gt:#7E5C1B;--gdt:rgba(197,160,89,.18);
  --ok:#066B4B;--okb:rgba(16,185,129,.14);--er:#B42336;--erb:rgba(180,35,54,.12);
  --term:#06231A;--termt:#9BE9C6;--termm:#5E8F7C;
  --sh:0 1px 0 rgba(255,255,255,.8) inset,0 10px 30px -18px rgba(6,59,43,.28);
  --hd:rgba(244,247,246,.86);color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050C0A;--panel:#0A1612;--panel2:#0D1C17;--in:#071210;
  --ink:#E9F4EF;--mut:#86A196;--ln:#183027;--ln2:#25483B;--grid:rgba(52,211,153,.045);
  --emt:#34D399;--gd:#D6B672;--gt:#E8CC8C;--gdt:rgba(214,182,114,.17);
  --ok:#6EE7B7;--okb:rgba(16,185,129,.17);--er:#FDA4AF;--erb:rgba(244,63,94,.17);
  --term:#020806;--termt:#7CF0BE;--termm:#4F7F6C;
  --sh:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px -18px rgba(0,0,0,.8);
  --hd:rgba(5,12,10,.86);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#050C0A;--panel:#0A1612;--panel2:#0D1C17;--in:#071210;
  --ink:#E9F4EF;--mut:#86A196;--ln:#183027;--ln2:#25483B;--grid:rgba(52,211,153,.045);
  --emt:#34D399;--gd:#D6B672;--gt:#E8CC8C;--gdt:rgba(214,182,114,.17);
  --ok:#6EE7B7;--okb:rgba(16,185,129,.17);--er:#FDA4AF;--erb:rgba(244,63,94,.17);
  --term:#020806;--termt:#7CF0BE;--termm:#4F7F6C;
  --sh:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px -18px rgba(0,0,0,.8);
  --hd:rgba(5,12,10,.86);color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;color:var(--ink);font:14px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;background-attachment:fixed;
}
h1,h2,h3,.hn{font-weight:800;letter-spacing:-.025em}
h3{font-size:14.5px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.mono,.v,#live-clk,kbd{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ===== TOP COMMAND HEADER ===== */
.cmd{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;
  padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:var(--hd);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--ln);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex-shrink:0}
.bt{display:flex;flex-direction:column;line-height:1.15}
.bt b{font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.bt span{font-size:11px;color:var(--mut);font-weight:600}
.logo{position:relative;width:42px;height:42px;perspective:500px;cursor:pointer;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.lg3{position:relative;width:100%;height:100%;display:grid;place-items:center;border-radius:13px;overflow:hidden;background:radial-gradient(circle at 30% 25%,#fff,#E4EFEA);transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transition:transform .22s ease-out,box-shadow .25s;box-shadow:0 0 0 1.5px var(--gd),0 6px 14px -6px rgba(6,59,43,.55)}
.logo:hover .lg3{box-shadow:0 0 0 1.5px #F2E2B8,0 0 16px rgba(16,185,129,.55)}
.lg3 img,.lg3 .fb{width:76%;height:76%;object-fit:contain}
.lg3 .fb{display:none}
.lg3 .gl{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,235,175,.9),transparent 60%)}
.logo:hover .gl{opacity:1}
.logo.pulse .lg3{animation:pulse .45s ease-out}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(.88)}75%{transform:scale(1.12)}100%{transform:scale(1)}}

nav#nv{flex:1;display:flex;justify-content:center;min-width:0}
.caps{display:inline-flex;gap:2px;padding:4px;border:1px solid var(--ln2);border-radius:999px;background:var(--panel);overflow-x:auto;scrollbar-width:none;max-width:100%}
.caps::-webkit-scrollbar{display:none}
.caps button{background:transparent;border:0;color:var(--mut);padding:7px 13px;border-radius:999px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .18s,color .18s}
.caps button:hover{color:var(--ink);background:var(--panel2)}
.caps button.on{background:var(--emd);color:#fff;box-shadow:0 0 0 1px var(--gd) inset}
.caps kbd{font-size:10.5px;font-weight:700;padding:0 5px;border-radius:5px;border:1px solid var(--ln2);color:var(--mut);line-height:1.5}
.caps button.on kbd{border-color:rgba(232,212,162,.55);color:#F0DFB4}

.hact{display:flex;align-items:center;gap:8px;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--ln2);background:var(--panel);color:var(--mut);white-space:nowrap}
.chip.ok{background:var(--okb);color:var(--ok);border-color:transparent}
.chip.lt{background:var(--gdt);color:var(--gt);border-color:transparent}
.chip.er{background:var(--erb);color:var(--er);border-color:transparent}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#8CA69A;flex-shrink:0}
.dot.on{background:#10B981;animation:ping 2s infinite}
.dot.off{background:#B42336}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(16,185,129,.7)}70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.gb{background:var(--panel);color:var(--ink);border:1px solid var(--ln2);border-radius:999px;padding:6px 13px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:border-color .18s,background .18s}
.gb:hover{border-color:var(--em)}
.gb.gold{background:var(--gd);color:#1E1504;border-color:transparent}
.gb.gold:hover{filter:brightness(1.07)}

main{max-width:1320px;margin:0 auto;padding:20px 20px 60px}
.pg-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.pg-head h1{font-size:22px;margin:0}

/* ===== BENTO ===== */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-items:start}
.c8{grid-column:span 8;display:grid;gap:16px;min-width:0}
.c4{grid-column:span 4;display:grid;gap:16px;min-width:0;position:sticky;top:78px}

.card{background:var(--panel);border:1px solid var(--ln);border-radius:16px;padding:20px 22px;box-shadow:var(--sh);margin-bottom:16px;min-width:0}
.c8 .card,.c4 .card,.two .card,.two-wide .card{margin-bottom:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}

/* Course Command Banner */
.ban{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--ln2);color:#F0F7F4;padding:22px 24px;
  background:
   linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/28px 28px,
   linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/28px 28px,
   radial-gradient(520px 240px at 90% 0%,rgba(197,160,89,.30),transparent 70%),
   linear-gradient(140deg,#0B5D44 0%,#063B2B 55%,#04271C 100%)}
.ban .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42;pointer-events:none}
.ban .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(4,32,23,.92) 0%,rgba(4,32,23,.62) 55%,rgba(4,32,23,.35) 100%)}
.ban .pcb{position:absolute;right:-20px;top:-10px;width:300px;height:200px;opacity:.5;pointer-events:none}
.ban>.in{position:relative}
.brow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.hs{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;font:inherit;font-size:13px;font-weight:600;width:auto;max-width:100%;margin:0;padding:6px 12px;border-radius:10px;cursor:pointer}
.hs:hover{border-color:var(--gd)}
.hs option{color:#08241B}
.ban .chip{background:rgba(255,255,255,.12);color:#EAF5EF;border-color:rgba(255,255,255,.2)}
.ban .chip.ok{background:rgba(16,185,129,.28);color:#B7F5DA}
.ban .chip.lt{background:rgba(197,160,89,.32);color:#F6E7BE}
.hn{font-size:clamp(24px,3.4vw,36px);line-height:1.12;margin:0 0 8px;color:#fff}
.hm{color:rgba(236,245,240,.86);font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clk{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:14px 0 4px}
#live-clk{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1;color:#fff}
#cd{font-size:12.5px;font-weight:700;color:#F0DFB4}
.bar{height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#34D399,#F0DFB4);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bl{font-size:12px;color:rgba(236,245,240,.8);display:flex;justify-content:space-between}

/* Telemetry strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1px solid var(--ln2);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.seg{padding:16px 18px;position:relative;border-left:1px solid var(--ln)}
.seg:first-child{border-left:0}
.seg::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--ac,var(--ln2))}
.seg.a1{--ac:#8CA69A}.seg.a2{--ac:var(--em)}.seg.a3{--ac:var(--gd)}.seg.a4{--ac:var(--er)}
.k{font-size:11.5px;font-weight:700;color:var(--mut);display:flex;align-items:center;justify-content:space-between;gap:6px}
.v{font-size:34px;font-weight:800;line-height:1.1;display:block;margin:8px 0 2px;letter-spacing:-.04em}
.k-sub{font-size:11.5px;color:var(--mut)}

/* Terminal / hardware console */
.term{background:var(--term);color:var(--termt);border:1px solid var(--ln2);border-radius:16px;overflow:hidden;box-shadow:var(--sh);font-family:"JetBrains Mono",monospace;font-size:12px}
.th{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(124,240,190,.14);color:var(--termm);font-size:11px;font-weight:600}
.th .led{display:inline-flex;align-items:center;gap:7px;color:var(--termt)}
.tb{padding:12px 14px;display:grid;gap:3px;line-height:1.7}
.tb .r{display:flex;justify-content:space-between;gap:10px}
.tb .r span:first-child{color:var(--termm)}
.tb .r span:last-child{text-align:right;word-break:break-word}
.tb .up{color:#34D399;font-weight:700}.tb .dn{color:#FB7185;font-weight:700}
.cur::after{content:"▍";margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Live tap monitor */
.tapc{position:relative;border:1px solid var(--ln2);border-radius:16px;background:var(--panel);padding:18px 20px;box-shadow:var(--sh);transition:border-color .3s,box-shadow .3s,background .3s}
.tapc.hot{border-color:var(--gd);background:linear-gradient(135deg,var(--okb),var(--gdt));box-shadow:0 0 0 3px var(--gdt),0 18px 36px -18px rgba(16,185,129,.55)}
.tapc .tt{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12px;font-weight:700;color:var(--mut)}
.tn{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.ts{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.idle{color:var(--mut);font-size:13px;padding:6px 0}

.hr,.rw{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.rw{margin:10px 0}
.mut{color:var(--mut);font-size:12.5px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:700;color:var(--mut);font-size:11.5px;border-bottom:1px solid var(--ln2)}
th,td{padding:10px 12px;white-space:nowrap}
tr+tr td{border-top:1px solid var(--ln)}
tr:hover td{background:var(--panel2)}
.b{padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.ok{background:var(--okb);color:var(--ok)}
.lt{background:var(--gdt);color:var(--gt)}
.no{background:var(--ln);color:var(--mut)}
.er{background:var(--erb);color:var(--er)}
.btn{background:var(--panel);color:var(--ink);border:1px solid var(--ln2);border-radius:12px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:border-color .18s,transform .18s}
.btn:hover{border-color:var(--em);transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.p{background:var(--emd);border-color:var(--gd);color:#fff}
.btn.p:hover{filter:brightness(1.15)}
.btn.er{color:var(--er);border-color:var(--er)}
.lk{background:none;border:0;color:var(--emt);cursor:pointer;font:inherit;font-weight:700;padding:0 6px;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color .2s}
.lk:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--em);outline-offset:2px}
label{display:block;margin-top:10px;font-size:12px;font-weight:600;color:var(--mut)}
.ck{display:flex;gap:8px;align-items:center}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:9px 12px;border:1px solid var(--ln2);border-radius:12px;background:var(--in);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--em);box-shadow:0 0 0 3px rgba(16,185,129,.16);outline:none}
input[type=checkbox]{accent-color:var(--em)}
.rw input,.rw select{width:auto;margin:0}.ck input{width:auto;margin:0}
.cb{max-height:150px;overflow:auto;border:1px solid var(--ln2);border-radius:12px;padding:6px 12px;margin-top:4px;background:var(--in)}
.cb label{display:flex;gap:8px;align-items:center;margin:4px 0;color:var(--ink);font-size:13px;font-weight:500}.cb input{width:auto;margin:0}
.ac{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.ls{list-style:none;margin:0;padding:0}
.ls li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}
.ls li:first-child{border:0;padding-top:2px}
.sub{font-size:11.5px;font-weight:700;color:var(--mut);margin:0 0 6px}

dialog{border:1px solid var(--ln2);border-radius:18px;background:var(--panel);color:var(--ink);width:min(460px,92vw);padding:24px;box-shadow:0 30px 70px -20px rgba(2,20,14,.6)}
dialog::backdrop{background:rgba(3,15,11,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog[open]{animation:pop .26s cubic-bezier(.2,.8,.2,1)}
#ts{margin:0;border:0;background:none;padding:0;inset:auto 16px calc(16px + env(safe-area-inset-bottom,0px)) auto;overflow:visible}
#ts:popover-open{display:grid;gap:8px}
.t{padding:11px 15px;border-radius:12px;background:var(--emd);color:#F0F7F4;border-left:3px solid var(--gd);max-width:360px;font-size:13px;font-weight:500;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);animation:toast .3s cubic-bezier(.2,.8,.2,1)}
.t.ok{border-color:var(--em)}.t.er{border-color:#F43F5E}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes toast{from{opacity:0;transform:translateX(18px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fill{from{width:0}}
.an .bar i{animation:fill 1s .15s ease-out backwards}
.an svg rect{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) backwards}
svg rect{transition:opacity .2s}svg rect:hover{opacity:.82}
#v{view-transition-name:pgv}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:1100px){
  .cmd{flex-wrap:wrap;gap:10px}
  nav#nv{order:3;flex-basis:100%}
  .caps{width:100%}
  .hact{margin-left:auto}
}
@media(max-width:980px){
  .c8,.c4{grid-column:1/-1}.c4{position:static}
}
@media(max-width:720px){
  main{padding:16px 14px 50px}
  .strip{grid-template-columns:repeat(2,1fr)}
  .seg:nth-child(3){border-left:0}
  .seg:nth-child(n+3){border-top:1px solid var(--ln)}
  .bt span,.caps kbd{display:none}
  #live-clk{font-size:30px}
  .hact .chip.hide-s{display:none}
}
</style>
</head>

function devInfo(){
  const d=(S.dev||[]).find(x=>x.aktif)||S.dev[0];
  if(!d||!d.terakhir_terlihat)return{on:false,txt:'Belum pernah terhubung',nama:d?d.nama:'Reader utama',sec:null};
  const diff=Math.floor((Date.now()-new Date(d.terakhir_terlihat).getTime())/1000);
  if(diff<=90)return{on:true,txt:diff<5?'baru saja':diff+' dtk lalu',nama:d.nama,sec:diff};
  const m=Math.floor(diff/60);
  return{on:false,txt:m<60?m+' mnt lalu':new Date(d.terakhir_terlihat).toLocaleString('id-ID'),nama:d.nama,sec:diff};
}

async function loadAll(notify){
  try{
    const [qMk,qAng,qPes,qPres,qSet,qDev]=await Promise.all([
      sb.from('mata_kuliah').select('*').order('kode'),
      sb.from('anggota').select(adm?'id,nim,nama,kelas,aktif,uid_kartu,punya_kartu':'id,nim,nama,kelas,aktif,punya_kartu').order('nama'),
      sb.from('peserta').select('anggota_id,mata_kuliah_id'),
      sb.from('presensi').select('*').order('tanggal',{ascending:false}).order('masuk',{ascending:false}).limit(2000),
      sb.from('pengaturan').select('*').limit(1).maybeSingle(),
      sb.from('perangkat').select('id,nama,aktif,terakhir_terlihat')
    ]);
    if(qMk.error)throw qMk.error;
    if(qAng.error)throw qAng.error;
    if(qPres.error)throw qPres.error;

    const pesMap={};
    (qPes.data||[]).forEach(p=>{
      if(!pesMap[p.anggota_id])pesMap[p.anggota_id]=[];
      pesMap[p.anggota_id].push(p.mata_kuliah_id);
    });

    S.mk=(qMk.data||[]).map(k=>({
      id:k.id,kode:k.kode,nama:k.nama,hari:k.hari,
      mulai:(k.mulai||'').slice(0,5),selesai:(k.selesai||'').slice(0,5),
      tol:k.toleransi_menit
    }));

    S.mem=(qAng.data||[]).map(m=>({
      id:m.id,nim:m.nim,nama:m.nama,kelas:m.kelas||'',
      aktif:m.aktif?1:0,uid:m.uid_kartu||'',punya:!!m.punya_kartu,
      mk:pesMap[m.id]||[]
    }));

    S.rec=(qPres.data||[]).map(r=>({
      rid:r.id,tgl:r.tanggal,id:r.anggota_id,mk:r.mata_kuliah_id,
      ms:(r.masuk||'').slice(0,5),pl:r.pulang?(r.pulang||'').slice(0,5):'',
      st:r.status,sumber:r.sumber
    }));

    if(qSet.data){
      S.set={
        tol:qSet.data.toleransi_menit,
        jeda:qSet.data.jeda_minimal_menit,
        deb:qSet.data.abaikan_ulang_detik,
        auto:qSet.data.sesi_otomatis?1:0,
        ak:qSet.data.sesi_aktif_id||'',
        dl:qSet.data.izinkan_ekspor?1:0
      };
    }
    S.dev=qDev.data||[];

    if(adm){
      const [qReg,qAud,qSesi]=await Promise.all([
        sb.from('riwayat_kartu').select('*').order('waktu',{ascending:false}).limit(20),
        sb.from('log_audit').select('*').order('waktu',{ascending:false}).limit(25),
        sb.from('sesi_registrasi').select('*').eq('selesai',false).gt('kedaluwarsa',new Date().toISOString()).order('dibuat_pada',{ascending:false}).limit(1).maybeSingle()
      ]);
      S.reg=(qReg.data||[]).map(x=>({t:x.waktu,id:x.anggota_id,u:x.uid,h:x.hasil}));
      S.aud=(qAud.data||[]).map(x=>({t:x.waktu,w:x.aktor?'admin':'perangkat',a:x.aksi,d:JSON.stringify(x.detail||{})}));
      regWait=qSesi.data||null;
    }else{
      S.reg=[];S.aud=[];regWait=null;
    }
    loading=0;
    render();
    if(notify)toast('Data berhasil disegarkan','ok');
  }catch(e){
    loading=0;
    toast('Gagal memuat data: '+(e.message||e),'er');
  }
}

function syncChip(){
  const e=$('#sync-st');if(!e)return;

  e.innerHTML=`<span class="dot ${rtOk?'on':'off'}"></span>${rtOk?'Realtime Terhubung':'Realtime Terputus'}`;

function setupRealtime(){
  sb.channel('rfid-live-channel')
    .on('postgres_changes',{event:'*',schema:'public',table:'presensi'},async payload=>{
      const row=payload.new;
      await loadAll(0);
      if((payload.eventType==='INSERT'||payload.eventType==='UPDATE')&&row){
        const m=M(row.anggota_id),c=MK(row.mata_kuliah_id);
        const tipe=row.pulang?'Pulang':'Masuk',jam=(row.pulang||row.masuk||'').slice(0,5);
        liveTap={nama:m?m.nama:'Mahasiswa',nim:m?m.nim:'',kelas:m?m.kelas:'',mk:c?c.nama:'',waktu:jam,tipe,status:row.status||'Hadir'};
        clearTimeout(tapTmr);
        tapTmr=setTimeout(()=>{liveTap=null;render()},12000);
        render();
        toast(`${liveTap.nama} — ${tipe} ${jam} (${liveTap.status})`,'ok');
      }
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'anggota'},()=>loadAll(0))
    .on('postgres_changes',{event:'*',schema:'public',table:'riwayat_kartu'},()=>loadAll(0))
    .on('postgres_changes',{event:'*',schema:'public',table:'sesi_registrasi'},()=>loadAll(0))
    .on('postgres_changes',{event:'*',schema:'public',table:'perangkat'},()=>loadAll(0))
    .subscribe(s=>{rtOk=(s==='SUBSCRIBED');syncChip()});

  setInterval(()=>{
    const tag=document.activeElement?.tagName;
    if($('#dg')?.open || tag==='INPUT' || tag==='TEXTAREA')return;
    loadAll(0);
  },15000);
}

function updateClock(){
  const el=$('#live-clk');if(!el)return;
  const d=new Date(),hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0'),ss=String(d.getSeconds()).padStart(2,'0');
  el.textContent=`${hh}:${mm}:${ss}`;
  const c=MK(kk()),cd=$('#cd');let extra='';
  if(c&&c.mulai&&d.getDay()==c.hari){
    const n=d.getHours()*60+d.getMinutes(),s=mn(c.mulai),e=mn(c.selesai);
    if(n>=s&&n<=e)extra=`Sisa ${e-n} menit kuliah`;
    else if(n<s)extra=`Mulai dalam ${s-n} menit`;
    else extra='Kuliah hari ini selesai';
  }
  if(cd)cd.textContent=extra;
}
setInterval(updateClock,1000);

function chart(a,k){
 const R=S.rec.filter(x=>x.mk==k),d=[...new Set(R.map(x=>x.tgl))].sort().slice(-7);
 if(!d.length)return '<p class="mut">Belum ada data presensi.</p>';
 const W=440,bw=36,g=(W-d.length*bw)/(d.length+1),sc=100/Math.max(a,...d.map(t=>R.filter(x=>x.tgl==t).length),1);
 return `<svg viewBox="0 0 ${W} 142" width="100%" role="img" aria-label="Grafik kehadiran 7 pertemuan terakhir"><line x1="0" y1="110" x2="${W}" y2="110" stroke="var(--ln2)" stroke-width="1"/>`+d.map((t,i)=>{
  const r=R.filter(x=>x.tgl==t),L=r.filter(x=>x.st=='Terlambat').length,O=r.length-L,x=g+i*(bw+g);
  return `<rect x="${x}" y="${110-O*sc}" width="${bw}" height="${O*sc}" rx="4" style="fill:var(--em)"/><rect x="${x}" y="${110-(O+L)*sc}" width="${bw}" height="${L*sc}" rx="4" style="fill:var(--gd)"/><text x="${x+bw/2}" y="130" text-anchor="middle" font-size="11" font-family="JetBrains Mono,monospace" style="fill:var(--mut)">${t.slice(8)}/${t.slice(5,7)}</text>`}).join('')+`</svg><p class="mut" style="margin-bottom:0">Hijau zamrud: tepat waktu · Emas: terlambat</p>`}

function logTap(){

 return e.length?'<ul class="ls">'+e.map(o=>`<li><span><strong>${esc(o.m.nama)}</strong><br><span class="mut mono">${esc(o.m.nim)}</span></span><span style="text-align:right"><span class="mut mono">${o.x.tgl.slice(8)}/${o.x.tgl.slice(5,7)} · ${o.x.pl?'Pulang '+o.x.pl:'Masuk '+o.x.ms}</span><br>${bd(o.x.st)}</span></li>`).join('')+'</ul>':'<p class="mut">Belum ada aktivitas pemindaian.</p>';
}

<label class="ck"><input type="checkbox" id="s6" ${s.dl?'checked':''}> Izinkan pengunjung mengekspor data</label>
<p class="mut">Jam mulai, jam selesai, dan toleransi khusus diatur pada setiap mata kuliah.</p>
<div class="ac"><button class="btn p" onclick="ss()">Simpan</button></div></div>
<div class="card"><h3>Akun admin (${esc(userEmail)})</h3><label>Kata sandi baru (minimal 8 karakter)<input type="password" id="p2" autocomplete="new-password"></label><div class="ac"><button class="btn" onclick="pw()">Ganti kata sandi</button></div>
<h3 style="margin-top:20px">Cadangan data</h3><div class="ac" style="justify-content:flex-start"><button class="btn" onclick="bk()">Ekspor JSON</button></div></div></div>
<div class="card tw"><h3>Log audit sistem</h3><table><tr><th>Waktu<th>Pelaku<th>Aksi<th>Detail</tr>${S.aud.map(a=>`<tr><td class="mono">${new Date(a.t).toLocaleString('id-ID')}<td>${esc(a.w)}<td>${esc(a.a)}<td class="mut mono">${esc(a.d.slice(0,80))}</tr>`).join('')||'<tr><td colspan="4">Belum ada aktivitas</tr>'}</table></div>`}

async function ss(){
 const payload={
   toleransi_menit:Math.max(0,+$('#s2').value||0),
   jeda_minimal_menit:Math.max(0,+$('#s4').value||0),
   abaikan_ulang_detik:Math.max(0,+$('#s5').value||0),
   sesi_otomatis:$('#s7').checked,
   izinkan_ekspor:$('#s6').checked
 };
 const {error}=await sb.from('pengaturan').update(payload).eq('id',true);
 if(error){toast('Gagal menyimpan: '+error.message,'er');return}
 toast('Pengaturan tersimpan','ok');await loadAll(0);
}

async function pw(){
 const b=$('#p2').value;if(b.length<8){toast('Kata sandi baru minimal 8 karakter','er');return}
 const {error}=await sb.auth.updateUser({password:b});
 if(error){toast('Gagal mengganti kata sandi: '+error.message,'er');return}
 $('#p2').value='';toast('Kata sandi admin diperbarui','ok');
}

function csv(){return 'Tanggal,Mata kuliah,NIM,Nama,Masuk,Pulang,Status\n'+S.rec.map(x=>[x.tgl,'"'+((MK(x.mk)||{}).kode||'')+'"',((M(x.id)||{}).nim||''),'"'+((M(x.id)||{}).nama||'')+'"',x.ms,x.pl,x.st].join(',')).join('\n')}
function dlCsv(){
 const blob=new Blob(['\uFEFF'+csv()],{type:'text/csv;charset=utf-8;'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='presensi-polnes-'+TD()+'.csv';a.click();
 URL.revokeObjectURL(a.href);toast('File CSV berhasil diunduh','ok');
}
function ex(){dlg(`<h3>Ekspor CSV</h3><p class="mut">Unduh langsung sebagai file Excel (.csv) atau salin teks di bawah.</p><textarea readonly rows="7" onfocus="this.select()">${esc(csv())}</textarea><div class="ac"><button class="btn" onclick="${cl}">Tutup</button><button class="btn p" onclick="dlCsv()">Unduh file .csv</button></div>`)}
function bk(){dlg(`<h3>Cadangan JSON</h3><p class="mut">Salin dan simpan teks ini di tempat yang aman.</p><textarea readonly rows="8" onfocus="this.select()">${esc(JSON.stringify(S))}</textarea><div class="ac"><button class="btn" onclick="${cl}">Tutup</button></div>`)}

function lgn(){
 dlg(`<h3>Masuk admin</h3><label>Email admin<input type="email" id="em" value="yonariviansyah715@gmail.com" autocomplete="username"></label><label>Kata sandi<input type="password" id="pw" autocomplete="current-password" onkeydown="if(event.key==='Enter')masuk()"></label><div class="ac"><button class="btn" onclick="${cl}">Batal</button><button class="btn p" onclick="masuk()">Masuk</button></div>`);
 $('#pw').focus();
}

async function masuk(){
 const email=$('#em').value.trim(),password=$('#pw').value;
 if(!email||!password){toast('Isi email dan kata sandi','er');return}
 const {data,error}=await sb.auth.signInWithPassword({email,password});
 if(error){toast('Gagal masuk: '+error.message,'er');return}
 const role=data?.user?.app_metadata?.role;
 if(role!=='admin'){
   await sb.auth.signOut();
   toast('Akun ini tidak memiliki hak akses admin','er');return;
 }
 adm=1;userEmail=data.user.email;$('#dg').close();
 toast('Berhasil masuk sebagai admin','ok');await loadAll(0);
}

async function out(){
 await sb.auth.signOut();
 adm=0;userEmail='';toast('Keluar dari mode admin','no');await loadAll(0);
}

/* ===== Emblem Polnes: tilt 3D mengikuti kursor, kilau emas, pulse saat diklik ===== */
(()=>{
 const l=$('#logo');if(!l)return;
 const t=l.firstElementChild,rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
 l.addEventListener('pointermove',e=>{
  if(rm)return;
  const r=l.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  t.style.setProperty('--ry',((x-.5)*28)+'deg');t.style.setProperty('--rx',((.5-y)*28)+'deg');
  t.style.setProperty('--sc',1.1);t.style.setProperty('--mx',(x*100)+'%');t.style.setProperty('--my',(y*100)+'%');
 });
 l.addEventListener('pointerleave',()=>{t.style.setProperty('--rx','0deg');t.style.setProperty('--ry','0deg');t.style.setProperty('--sc',1)});
 l.addEventListener('click',()=>{l.classList.remove('pulse');void l.offsetWidth;l.classList.add('pulse');setTimeout(()=>l.classList.remove('pulse'),750)});
})();

tmLabel();
(async()=>{
 await checkAuth();
 await loadAll(0);
 setupRealtime();
})();
</script>
</body>
</html>
