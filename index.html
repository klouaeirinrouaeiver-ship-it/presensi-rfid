<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presensi RFID Polnes</title>
<link rel="icon" href="./logo-polnes.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--em:#0B5D44;--gd:#C5A059;--bg:#EEF3F0;--ink:#0A2119;--mut:#526B60;--ln:rgba(11,93,68,.16);--ok:#066B4B;--er:#B42336}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}
input,select{width:100%;padding:10px 12px;margin:4px 0 10px;border:1px solid var(--ln);border-radius:10px;background:#fff}
input.bad{border:2px solid var(--er)}
label{font-size:12px;font-weight:600;color:var(--mut)}
.btn{border:1px solid var(--ln);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.p{background:var(--em);color:#fff;border:0;width:100%}
.btn.g{background:linear-gradient(135deg,#EEDBAE,#C5A059);border:0;width:100%;color:#2a1d04}
.b{padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--ln);color:var(--mut)}
.b.ok{background:rgba(16,185,129,.15);color:var(--ok)}.b.lt{background:rgba(197,160,89,.2);color:#825E18}.b.er{background:rgba(180,35,54,.12);color:var(--er)}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px -14px rgba(6,44,32,.2)}
.mut{color:var(--mut);font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
/* GATE */
#gate{min-height:100vh;display:grid;place-items:center;padding:16px;position:relative;overflow:hidden}
#gate .bg{position:fixed;top:-5%;left:-6%;width:112%;height:110%;object-fit:cover;z-index:0;animation:campusPan 24s ease-in-out infinite}
#gate::before{content:"";position:fixed;inset:0;background:rgba(3,25,18,.62);z-index:1}
@keyframes campusPan{0%{transform:translate3d(3.5%,-1%,0) scale(1.04)}38%,50%{transform:translate3d(-3.5%,1%,0) scale(1.05)}88%,100%{transform:translate3d(3.5%,-1%,0) scale(1.04)}}
.glass{position:relative;z-index:2;width:min(420px,100%);padding:22px;border-radius:22px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border:1px solid rgba(197,160,89,.6)}
.glass h1{font-size:20px;margin:6px 0 14px;text-align:center;color:var(--em)}
.glass .logo{display:block;margin:0 auto;height:64px}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1}
.tabs .on{background:var(--em);color:#fff}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.roles div{border:2px solid var(--ln);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;font-weight:700;font-size:12px;background:#fff}
.roles div.on{border-color:var(--gd);background:rgba(197,160,89,.18)}
.roles div span{display:block;font-size:22px}
.pw{position:relative}.pw button{position:absolute;right:6px;top:8px;border:0;background:none;cursor:pointer;font-size:16px}
.info{display:none;background:rgba(180,35,54,.08);border:1px solid var(--er);border-radius:10px;padding:10px;font-size:12px;margin-bottom:10px}
.info.show{display:block}
/* ADMIN */
.adm{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#063B2B,#042118);color:#ECF5F0;padding:16px;position:sticky;top:0;height:100vh}
.side img{height:44px}.side button{display:block;width:100%;text-align:left;background:none;border:0;color:#ECF5F0;padding:10px;border-radius:10px;cursor:pointer;font-weight:600}
.side button.on{background:rgba(197,160,89,.25)}
.main{padding:18px;min-width:0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi b{font-size:28px;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mk{position:relative;border-radius:16px;overflow:hidden;min-height:130px;color:#fff;background:#063B2B}
.mk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.mk .t{position:relative;padding:14px;height:100%;min-height:130px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(0deg,rgba(3,25,18,.9),rgba(3,25,18,.1))}
.mk small{opacity:.9}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
body.kiosk .side{display:none}body.kiosk .adm{grid-template-columns:1fr}
/* MOBILE */
.top{position:sticky;top:0;z-index:20;background:var(--em);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.top button{background:none;border:0;color:#fff;font-size:24px;cursor:pointer}
.mob{padding:14px;max-width:480px;margin:0 auto}
#bd{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:none}#bd.show{display:block}
#dr{position:fixed;top:0;bottom:0;left:0;width:280px;background:#063B2B;color:#fff;z-index:31;transform:translateX(-100%);transition:transform .25s;padding:18px;display:flex;flex-direction:column;gap:4px}
#dr.show{transform:none}
#dr button{background:none;border:0;color:#fff;text-align:left;padding:12px;border-radius:10px;font-weight:600;cursor:pointer}
#dr button.on{background:rgba(197,160,89,.25)}
.bar{height:8px;background:var(--ln);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--em)}.bar i.er{background:var(--er)}
#ts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#063B2B;color:#fff;padding:10px 16px;border-radius:12px;z-index:99;display:none;max-width:90vw}
@media(max-width:800px){.adm{grid-template-columns:1fr}.side{height:auto;position:static}}
</style>
</head>
<body>
<div id="app"></div><div id="bd" onclick="drawer(0)"></div><div id="ts"></div>
<script>
const sb=supabase.createClient('https://muwlrysxpuygrinrnere.supabase.co','sb_publishable_AYYctBNraAafTSMnPzFomw_xLICzKw0');
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const DN=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const IMG=[['administrator jaringan','administrator_jaringan'],['administrasi jaringan','administrator_jaringan'],['mikroprosesor','mikroprosesor'],['mikroprosessor','mikroprosesor'],['organisasi','organisasi_dan_arsitektur_komputer'],['arsitektur komputer','organisasi_dan_arsitektur_komputer'],['berorientasi','pemrograman_berorientasi_obyek'],['web','pemrograman_web'],['rangkaian digital','rangkaian_digital'],['telekomunikasi','telekomunikasi']];
const imgOf=n=>{n=String(n||'').toLowerCase();const m=IMG.find(x=>n.includes(x[0]));return './'+(m?m[1]:'kampus')+'.jpg'};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const mn=t=>{if(!t)return 0;const a=t.split(':');return +a[0]*60+ +a[1]};
const hm=t=>(t||'').slice(0,5);
const toast=m=>{const t=$('#ts');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)};
const normWA=v=>{let d=String(v||'').replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);return d};
const waOk=v=>/^628\d{8,12}$/.test(v);
let me=null,S={mk:[],ang:[],pes:[],pre:[],dev:[],taps:[]},pg='',sel='',tab='masuk',role='';
const MENU={
 admin:[['dash','📊 Dashboard'],['mk','📚 Mata Kuliah'],['user','👥 Pengguna'],['log','📋 Log Presensi']],
 mahasiswa:[['kartu','🪪 Kartu Saya'],['stat','📈 Statistik'],['riw','🕒 Riwayat'],['wa','📱 WhatsApp']],
 dosen:[['kelas','🏫 Kelas Saya'],['kor','📝 Koreksi Presensi']]
};

/* ===== GERBANG ===== */
function eye(b){const i=b.previousElementSibling;i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁️':'🙈'}
const pwf=id=>`<div class="pw"><input type="password" id="${id}" placeholder="Kata sandi" autocomplete="current-password"><button type="button" onclick="eye(this)">👁️</button></div>`;
function gate(){
 $('#app').innerHTML=`<div id="gate"><img class="bg" src="./kampus.jpg" alt=""><div class="glass">
 <img class="logo" src="./logo-polnes.png" alt=""><h1>Presensi RFID Polnes</h1>
 <div class="tabs"><button class="btn ${tab=='masuk'?'on':''}" onclick="tab='masuk';gate()">🔐 Masuk</button><button class="btn ${tab=='daftar'?'on':''}" onclick="tab='daftar';gate()">✨ Daftar Awal</button></div>
 ${tab=='masuk'?`<button class="btn g" onclick="google()">🚀 Masuk dengan Google</button><p class="mut" style="text-align:center">atau</p>
  <label>📧 Email</label><input id="em" type="email" autocomplete="username"><label>🔑 Kata Sandi</label>${pwf('pw')}
  <button class="btn p" onclick="emailAuth(0)">Masuk dengan Email</button>`
 :`<label>1. Pilih peran</label><div class="roles">${[['mahasiswa','🎓','Mahasiswa'],['dosen','👨‍🏫','Dosen'],['admin','🛡️','Admin']].map(r=>`<div class="${role==r[0]?'on':''}" onclick="role='${r[0]}';gate()"><span>${r[1]}</span>${r[2]}</div>`).join('')}</div>
  <label>2. 📱 Nomor WhatsApp Aktif</label><input id="wa" inputmode="tel" placeholder="08xxxxxxxxxx">
  <div class="info" id="wai"><b>Kenapa WhatsApp?</b><br>• Pengingat otomatis saat jam mulai matkul jika belum tap kartu.<br>• Ringkasan kehadiran kelas (khusus Dosen).<br>• Anti-spam: maksimal 1x per matkul.</div>
  <label>3. Daftar</label><button class="btn g" onclick="google(1)">🌐 Daftar dengan Google (Gmail)</button>
  <p class="mut" style="text-align:center">atau</p><label>📧 Email</label><input id="em" type="email"><label>🔑 Buat Kata Sandi</label>${pwf('pw')}
  <button class="btn p" onclick="emailAuth(1)">Daftar dengan Email</button>`}
 </div></div>`;
}
function cekDaftar(){
 const w=normWA($('#wa').value);
 if(!role){toast('Pilih peran dulu');return null}
 if(!waOk(w)){$('#wa').classList.add('bad');$('#wai').classList.add('show');$('#wa').focus();return null}
 localStorage.setItem('pend',JSON.stringify({wa:w,peran:role}));return w;
}
async function google(daftar){
 if(daftar&&!cekDaftar())return;
 const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
 if(error)toast(error.message);
}
async function emailAuth(daftar){
 const email=$('#em').value.trim(),password=$('#pw').value;
 if(!email||!password){toast('Isi email dan kata sandi');return}
 if(daftar){if(!cekDaftar())return;const {error}=await sb.auth.signUp({email,password});if(error)return toast(error.message);toast('Pendaftaran berhasil, cek email bila perlu verifikasi')}
 else{const {error}=await sb.auth.signInWithPassword({email,password});if(error)return toast(error.message)}
 boot();
}
function activ(){
 $('#app').innerHTML=`<div id="gate"><img class="bg" src="./kampus.jpg" alt=""><div class="glass"><h1>Lengkapi Aktivasi Akun</h1>
 <label>Peran</label><div class="roles">${[['mahasiswa','🎓','Mahasiswa'],['dosen','👨‍🏫','Dosen'],['admin','🛡️','Admin']].map(r=>`<div class="${role==r[0]?'on':''}" onclick="role='${r[0]}';localStorage.setItem('peranHint',role);activ()"><span>${r[1]}</span>${r[2]}</div>`).join('')}</div>
 <label>📱 Nomor WhatsApp Aktif</label><input id="wa" inputmode="tel" placeholder="08xxxxxxxxxx">
 <button class="btn p" onclick="simpanAkt()">Simpan & Masuk</button><button class="btn" style="width:100%;margin-top:8px" onclick="keluar()">Keluar</button></div></div>`;
}
async function simpanAkt(){
 const w=normWA($('#wa').value);if(!waOk(w))return toast('Nomor WhatsApp tidak valid');
 const {error}=await sb.rpc('tautkan_akun',{p_no_wa:w});if(error)return toast(error.message);
 boot();
}
async function keluar(){await sb.auth.signOut();me=null;location.reload()}

/* ===== BOOT ===== */
async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session)return gate();
 let p={};try{p=JSON.parse(localStorage.getItem('pend')||'{}')}catch(e){}
 await sb.rpc('tautkan_akun',{p_no_wa:p.wa||null});
 const {data}=await sb.from('anggota').select('*').eq('user_id',session.user.id).maybeSingle();
 me=data;
 if(!me){$('#app').innerHTML='<div class="mob"><div class="card"><b>Akun belum terdaftar</b><p class="mut">Hubungi admin untuk menautkan akun ini.</p><button class="btn p" onclick="keluar()">Keluar</button></div></div>';return}
 if(!me.no_wa||!me.peran){role=me.peran||'';return activ()}
 localStorage.removeItem('pend');
 await load();
 pg=MENU[me.peran][0][0];shell();
 if(me.peran==='admin')sb.channel('live').on('postgres_changes',{event:'*',schema:'public',table:'presensi'},async p=>{
  await load();const r=p.new;if(r&&r.anggota_id){const a=S.ang.find(x=>x.id==r.anggota_id)||{};S.taps=[{n:a.nama||'Mahasiswa',j:hm(r.pulang||r.masuk),s:r.status},...S.taps].slice(0,5);toast((a.nama||'Tap')+' — '+hm(r.masuk))}draw()}).subscribe();
}
async function load(){
 const adm=me.peran==='admin';
 const [a,b,c,d,e]=await Promise.all([
  sb.from('mata_kuliah').select('*').order('kode'),
  adm||me.peran==='dosen'?sb.from('anggota').select('*').order('nama'):sb.from('anggota').select('*').eq('id',me.id),
  sb.from('peserta').select('anggota_id,mata_kuliah_id'),
  sb.from('presensi').select('*').order('tanggal',{ascending:false}).order('masuk',{ascending:false}).limit(1000),
  sb.from('perangkat').select('id,nama,aktif,terakhir_terlihat')]);
 S.mk=a.data||[];S.ang=b.data||[];S.pes=c.data||[];S.pre=d.data||[];S.dev=e.data||[];
}

/* ===== SHELL ===== */
function shell(){
 const m=MENU[me.peran],nav=(c)=>m.map(x=>`<button class="${x[0]==pg?'on':''}" onclick="${c}('${x[0]}')">${x[1]}</button>`).join('');
 if(me.peran==='admin'){
  $('#app').innerHTML=`<div class="adm"><aside class="side"><img src="./logo-polnes.png" alt=""><h3>Presensi RFID</h3>${nav('go')}<button onclick="toggleFull()">🖥️ Mode Proyektor</button><button onclick="keluar()">🚪 Keluar</button></aside><main class="main" id="main"></main></div>`;
 }else{
  $('#app').innerHTML=`<header class="top"><button onclick="drawer(1)" aria-label="Menu">☰</button><b>Presensi RFID Polnes</b></header>
  <nav id="dr"><div><b>${esc(me.nama)}</b><div class="mut" style="color:#A7F3D0">${esc(me.nim||me.nidn||'')}</div></div><hr style="width:100%;border-color:rgba(255,255,255,.2)">${nav('goM')}<span style="flex:1"></span><button onclick="keluar()">🚪 Keluar</button></nav>
  <main class="mob" id="main"></main>`;
 }
 draw();
}
function drawer(o){$('#dr')?.classList.toggle('show',!!o);$('#bd').classList.toggle('show',!!o)}
function go(p){pg=p;shell()}
function goM(p){pg=p;drawer(0);shell()}
function toggleFull(){if(!document.fullscreenElement){document.documentElement.requestFullscreen().then(()=>document.body.classList.add('kiosk'))}else document.exitFullscreen().then(()=>document.body.classList.remove('kiosk'))}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('kiosk')});
const draw=()=>{const f=V[me.peran+'_'+pg];$('#main').innerHTML=f?f():'<div class="card">Segera hadir.</div>'};

/* ===== KOMPONEN ===== */
const bd=s=>`<span class="b ${s=='Hadir'?'ok':s=='Terlambat'?'lt':s=='Izin'||s=='Sakit'?'':'er'}">${esc(s)}</span>`;
const mkCard=k=>`<div class="mk"><img src="${imgOf(k.nama)}" onerror="this.onerror=null;this.src='./kampus.jpg'" alt=""><div class="t"><b>${esc(k.nama)}</b><small>${esc(k.kode)} · ${DN[k.hari]} ${hm(k.mulai)}–${hm(k.selesai)} ${esc(k.ruangan||'')}</small></div></div>`;
const STS=['Hadir','Terlambat','Izin','Sakit'];
const nm=id=>(S.ang.find(x=>x.id==id)||{}).nama||'-';
const mkn=id=>(S.mk.find(x=>x.id==id)||{}).nama||'-';
function devInfo(){const d=S.dev.find(x=>x.aktif)||S.dev[0];if(!d||!d.terakhir_terlihat)return{on:0,n:'ESP8266',t:'Belum terhubung'};const s=(Date.now()-new Date(d.terakhir_terlihat))/1000;return{on:s<=90,n:d.nama,t:s<90?'Online':'Offline'}}
function myMk(){return me.peran==='dosen'?S.mk.filter(k=>k.dosen_id==me.id):S.mk.filter(k=>S.pes.some(p=>p.anggota_id==me.id&&p.mata_kuliah_id==k.id))}
async function setStatus(aid,mid,st){
 const t=today(),r=S.pre.find(x=>x.anggota_id==aid&&x.mata_kuliah_id==mid&&x.tanggal==t);
 const q=r?sb.from('presensi').update({status:st}).eq('id',r.id):sb.from('presensi').insert({anggota_id:aid,mata_kuliah_id:mid,tanggal:t,masuk:new Date().toTimeString().slice(0,8),status:st,sumber:'manual'});
 const {error}=await q;if(error)return toast(error.message);toast('Status diperbarui');await load();draw();
}
async function setStatusId(id,st){const {error}=await sb.from('presensi').update({status:st}).eq('id',id);if(error)return toast(error.message);await load();draw()}
const stSel=(id,cur)=>`<select onchange="setStatusId('${id}',this.value)" style="width:auto;margin:0">${STS.map(s=>`<option ${s==cur?'selected':''}>${s}</option>`).join('')}</select>`;

/* ===== VIEW ===== */
const V={
 admin_dash(){
  const t=today(),p=S.pre.filter(x=>x.tanggal==t),d=devInfo();
  return `<div class="kpi"><div class="card"><span class="mut">Hadir hari ini</span><b>${p.length}</b></div><div class="card"><span class="mut">Terlambat</span><b>${p.filter(x=>x.status=='Terlambat').length}</b></div><div class="card"><span class="mut">Mahasiswa</span><b>${S.ang.filter(x=>x.peran=='mahasiswa').length}</b></div><div class="card"><span class="mut">${esc(d.n)}</span><b style="font-size:20px">${d.on?'🟢 Online':'🔴 Offline'}</b></div></div>
  <div class="card"><h3>Live Tap Monitor</h3>${S.taps.map(x=>`<div class="row" style="padding:6px 0"><b>${esc(x.n)}</b><span class="mut">${x.j}</span>${bd(x.s)}</div>`).join('')||'<p class="mut">Tempelkan kartu pada pembaca…</p>'}</div>
  <h3>Mata Kuliah</h3><div class="grid">${S.mk.map(mkCard).join('')}</div>`},
 admin_mk(){return `<div class="card tw"><table><tr><th>Kode<th>Nama<th>Jadwal<th>Toleransi<th>Ruangan</tr>${S.mk.map(k=>`<tr><td>${esc(k.kode)}<td>${esc(k.nama)}<td>${DN[k.hari]} ${hm(k.mulai)}–${hm(k.selesai)}<td>${k.toleransi_menit??'-'} mnt<td>${esc(k.ruangan||'-')}</tr>`).join('')}</table></div><p class="mut">Form tambah/ubah/hapus belum disertakan di versi inti ini.</p>`},
 admin_user(){return `<div class="card tw"><table><tr><th>Nama<th>NIM/NIDN<th>Peran<th>Status</tr>${S.ang.map(a=>`<tr><td>${esc(a.nama)}<td>${esc(a.nim||a.nidn||'')}<td>${esc(a.peran)}<td><button class="btn" onclick="togAktif('${a.id}',${!a.aktif})">${a.aktif?'Aktif':'Nonaktif'}</button></tr>`).join('')}</table></div>`},
 admin_log(){
  const f=sel,r=S.pre.filter(x=>!f||x.mata_kuliah_id==f).slice(0,100);
  return `<select onchange="sel=this.value;draw()"><option value="">Semua mata kuliah</option>${S.mk.map(k=>`<option value="${k.id}" ${k.id==f?'selected':''}>${esc(k.nama)}</option>`).join('')}</select><div class="card tw"><table><tr><th>Tanggal<th>Nama<th>Matkul<th>Masuk<th>Pulang<th>Status</tr>${r.map(x=>`<tr><td>${x.tanggal}<td>${esc(nm(x.anggota_id))}<td>${esc(mkn(x.mata_kuliah_id))}<td>${hm(x.masuk)}<td>${hm(x.pulang)||'—'}<td>${stSel(x.id,x.status)}</tr>`).join('')}</table></div>`},
 mahasiswa_kartu(){
  const hr=myMk().filter(k=>k.hari==new Date().getDay());
  return `<div class="card" style="background:linear-gradient(135deg,#0B5D44,#063024);color:#fff"><img src="./logo-polnes.png" style="height:40px" alt=""><h2 style="margin:8px 0 2px">${esc(me.nama)}</h2><div>${esc(me.nim||'')} · ${esc(me.kelas||'')}</div><p>Kartu RFID: ${me.uid_kartu||me.punya_kartu?'<span class="b ok">Terdaftar</span>':'<span class="b er">Belum ada kartu</span>'}</p></div>
  <h3>Jadwal Hari Ini</h3>${hr.map(k=>{const tol=+(k.toleransi_menit??15);return `<div style="margin-bottom:10px">${mkCard(k)}<div class="mut" data-cd="${mn(k.mulai)+tol}" style="padding:4px 6px"></div></div>`}).join('')||'<p class="mut">Tidak ada kuliah hari ini.</p>'}`},
 mahasiswa_stat(){setTimeout(statLoad,0);return '<div id="st"><p class="mut">Memuat…</p></div>'},
 mahasiswa_riw(){return S.pre.filter(x=>x.anggota_id==me.id).slice(0,50).map(x=>`<div class="card"><div class="row"><b>${esc(mkn(x.mata_kuliah_id))}</b>${bd(x.status)}</div><div class="mut">${x.tanggal} · Masuk ${hm(x.masuk)} · Pulang ${hm(x.pulang)||'—'}</div></div>`).join('')||'<p class="mut">Belum ada riwayat.</p>'},
 mahasiswa_wa(){return `<div class="card"><label>📱 Nomor WhatsApp notifikasi</label><input id="nw" value="${esc(me.no_wa||'')}"><button class="btn p" onclick="simWA()">Simpan</button></div>`},
 dosen_kelas(){
  const ks=myMk();if(!ks.length)return '<div class="card">Belum ada mata kuliah yang diampu.</div>';
  const k=ks.find(x=>x.id==sel)||ks[0],t=today(),ps=S.ang.filter(a=>S.pes.some(p=>p.anggota_id==a.id&&p.mata_kuliah_id==k.id)),
   pr=S.pre.filter(x=>x.mata_kuliah_id==k.id&&x.tanggal==t),by=id=>pr.find(x=>x.anggota_id==id),
   h=ps.filter(a=>by(a.id)&&by(a.id).status=='Hadir').length,l=ps.filter(a=>by(a.id)&&by(a.id).status=='Terlambat').length,my=by(me.id);
  return `<select onchange="sel=this.value;draw()">${ks.map(x=>`<option value="${x.id}" ${x.id==k.id?'selected':''}>${esc(x.nama)}</option>`).join('')}</select>${mkCard(k)}
  <p>Tap saya hari ini: ${my?bd(my.status)+' '+hm(my.masuk):'<span class="b er">Belum tap</span>'}</p>
  <div class="kpi" style="grid-template-columns:1fr 1fr"><div class="card"><span class="mut">Peserta</span><b>${ps.length}</b></div><div class="card"><span class="mut">Hadir</span><b>${h}</b></div><div class="card"><span class="mut">Terlambat</span><b>${l}</b></div><div class="card"><span class="mut">Belum hadir</span><b>${ps.filter(a=>!by(a.id)).length}</b></div></div>
  ${ps.map(a=>{const r=by(a.id);return `<div class="card"><div class="row"><b>${esc(a.nama)}</b>${r?bd(r.status):'<span class="b er">Belum hadir</span>'}</div><div class="mut">${esc(a.nim||'')}</div><div class="row" style="justify-content:flex-start;margin-top:8px">${STS.map(s=>`<button class="btn" style="padding:6px 9px;font-size:12px" onclick="setStatus('${a.id}','${k.id}','${s}')">${s}</button>`).join('')}</div></div>`}).join('')}`},
 dosen_kor(){
  const ids=myMk().map(k=>k.id),r=S.pre.filter(x=>ids.includes(x.mata_kuliah_id)&&(!sel||x.mata_kuliah_id==sel)).slice(0,100);
  return `<select onchange="sel=this.value;draw()"><option value="">Semua kelas saya</option>${myMk().map(k=>`<option value="${k.id}" ${k.id==sel?'selected':''}>${esc(k.nama)}</option>`).join('')}</select>${r.map(x=>`<div class="card"><div class="row"><b>${esc(nm(x.anggota_id))}</b>${stSel(x.id,x.status)}</div><div class="mut">${esc(mkn(x.mata_kuliah_id))} · ${x.tanggal} · ${hm(x.masuk)}</div></div>`).join('')}`}
};
async function togAktif(id,v){const {error}=await sb.from('anggota').update({aktif:v}).eq('id',id);if(error)return toast(error.message);await load();draw()}
async function simWA(){const w=normWA($('#nw').value);if(!waOk(w))return toast('Nomor tidak valid');const {error}=await sb.from('anggota').update({no_wa:w}).eq('id',me.id);if(error)return toast(error.message);me.no_wa=w;toast('Nomor tersimpan')}
async function statLoad(){
 const el=$('#st');if(!el)return;let h='';
 for(const k of myMk()){
  let tot=0;const {data,error}=await sb.rpc('jumlah_pertemuan',{p_mata_kuliah_id:k.id});
  tot=!error&&data!=null?+data:new Set(S.pre.filter(x=>x.mata_kuliah_id==k.id).map(x=>x.tanggal)).size;
  const hd=S.pre.filter(x=>x.mata_kuliah_id==k.id&&x.anggota_id==me.id&&(x.status=='Hadir'||x.status=='Terlambat')).length,pc=tot?Math.round(hd/tot*100):0;
  h+=`<div class="card"><div class="row"><b>${esc(k.nama)}</b><span class="b ${pc<80?'er':'ok'}">${pc}%</span></div><div class="bar"><i class="${pc<80?'er':''}" style="width:${Math.min(100,pc)}%"></i></div><div class="mut">${hd}/${tot} pertemuan${pc<80?' · ⚠️ di bawah 80%':''}</div></div>`;
 }
 el.innerHTML=h||'<p class="mut">Belum ada mata kuliah.</p>';
}
setInterval(()=>document.querySelectorAll('[data-cd]').forEach(e=>{const d=new Date(),n=d.getHours()*60+d.getMinutes()-0,s=d.getSeconds(),left=+e.dataset.cd*60-(n*60+s);e.textContent=left>0?`⏳ Batas tepat waktu ${String(Math.floor(left/3600)).padStart(2,'0')}:${String(Math.floor(left%3600/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`:'⛔ Batas tepat waktu sudah lewat'}),1000);
sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN'&&!me)boot()});
boot();
</script>
</body>
</html>
