<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B5D44">
<title>Presensi RFID | Politeknik Negeri Samarinda</title>
<style>
:root{--bg:#EEF3F0;--pn:#fff;--ink:#0A2119;--mut:#526B60;--ln:rgba(11,93,68,.15);--em:#10B981;--dk:#0B5D44;--gd:#C5A059;--in:#F5F9F7;--er:#B42336;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#050C0A;--pn:#0B1914;--ink:#EDF4F1;--mut:#839E92;--ln:rgba(52,211,153,.18);--in:#081611;--er:#FDA4AF;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Plus Jakarta Sans",sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.sb{background:linear-gradient(180deg,#063B2B,#042118);color:#ECF5F0;padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{padding:4px 8px 14px;border-bottom:1px solid rgba(197,160,89,.4);margin-bottom:8px}.brand b{display:block;color:#E8D4A2;font-size:16px}.brand small{opacity:.7}
.sb button{background:none;border:0;color:inherit;text-align:left;padding:9px 12px;border-radius:10px;font:inherit;cursor:pointer}
.sb button:hover{background:rgba(16,185,129,.15)}.sb button.on{background:rgba(16,185,129,.28);box-shadow:inset 3px 0 0 var(--gd)}.sp{flex:1}.mut2{opacity:.7;padding:0 8px}
main{padding:22px;min-width:0}h2{margin:0 0 14px;font-size:20px}h3{margin:0 0 10px;font-size:15px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px;overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--pn);border:1px solid var(--ln);border-top:3px solid var(--em);border-radius:14px;padding:14px}.kpi:nth-child(3){border-top-color:var(--gd)}
.kpi span{color:var(--mut);font-size:12px}.kpi b{display:block;font-size:28px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--ln)}th{font-size:11px;text-transform:uppercase;color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--ln)}
.mut{color:var(--mut)}.mono{font-family:ui-monospace,monospace}
.b{padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--ln);color:var(--mut)}.b.ok{background:rgba(16,185,129,.16);color:#0a7a55}.b.lt{background:rgba(197,160,89,.2);color:#8a6414}.b.er{background:rgba(180,35,54,.14);color:var(--er)}
button,input,select{font:inherit}button.btn,.ac button,.rw button{background:var(--pn);color:var(--ink);border:1px solid var(--ln);border-radius:9px;padding:7px 12px;cursor:pointer}
button.p{background:var(--dk)!important;color:#fff!important;border-color:transparent!important}button.g{background:linear-gradient(135deg,#EEDBAE,#C5A059)!important;color:#1E1504!important;border:0!important}
input,select{width:100%;padding:8px 10px;border:1px solid var(--ln);border-radius:9px;background:var(--in);color:var(--ink)}
label{display:block;margin-top:10px;font-size:12px;font-weight:600;color:var(--mut)}.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rw{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.rw input,.rw select{width:auto}.ac{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.bar{height:7px;background:var(--ln);border-radius:9px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--em)}.bar i.w{background:var(--er)}
.hero{background:linear-gradient(125deg,#0B5A42,#042118);color:#ECF5F0;border:1px solid var(--gd);border-radius:16px;padding:20px;margin-bottom:14px}.hero b{font-size:26px}
dialog{border:1px solid var(--ln);border-radius:16px;background:var(--pn);color:var(--ink);width:min(480px,94vw);padding:20px}
.toast{position:fixed;right:16px;bottom:16px;background:#063B2B;color:#fff;border-left:3px solid var(--gd);padding:10px 14px;border-radius:10px;z-index:99;max-width:340px}
.gate{max-width:440px;margin:7vh auto;padding:0 16px}.gate .card{border-top:3px solid var(--gd)}
.gtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--in);padding:4px;border-radius:11px;border:1px solid var(--ln);margin-bottom:14px}
.gtabs button{border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--mut);cursor:pointer}
.gtabs button.on{background:var(--pn);color:var(--dk);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.rbtn{background:var(--in);border:1.5px solid var(--ln);border-radius:11px;padding:10px 6px;text-align:center;cursor:pointer;color:var(--ink);transition:.15s}
.rbtn b{display:block;font-size:13px}.rbtn small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.rbtn.on{border-color:var(--em);background:rgba(16,185,129,.12);box-shadow:inset 0 0 0 1px var(--em)}
.info-wa{display:none;background:rgba(197,160,89,.12);border:1px solid rgba(197,160,89,.45);border-left:4px solid var(--gd);border-radius:9px;padding:10px 12px;margin-top:10px;font-size:12px;color:var(--ink);animation:fadeIn .2s ease}
.info-wa.show{display:block}.info-wa b{display:block;margin-bottom:4px;color:var(--dk)}.info-wa ul{margin:0;padding-left:16px}.info-wa li{margin:3px 0}
.inp-err{border-color:var(--er)!important;box-shadow:0 0 0 2px rgba(180,35,54,.15)}
.gfoot{margin-top:14px;padding-top:12px;border-top:1px solid var(--ln);text-align:center;font-size:12.5px;color:var(--mut)}
.gfoot a{color:var(--dk);font-weight:600;text-decoration:none;cursor:pointer}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
body.proj main{font-size:17px}
@media(max-width:760px){.app{grid-template-columns:1fr}.sb{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.sp{display:none}}
</style></head>
<body><div id="app"></div><dialog id="dg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const sb=supabase.createClient('https://muwlrysxpuygrinrnere.supabase.co','sb_publishable_AYYctBNraAafTSMnPzFomw_xLICzKw0');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),TD=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};
const mn=t=>{const a=(t||'0:0').split(':');return +a[0]*60+ +a[1]},hm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const DN=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const normWa=s=>{let d=String(s||'').replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);else if(d.startsWith('8'))d='62'+d;return /^628\d{8,12}$/.test(d)?d:''};
let me=null,role='',gateMode='login',wantRole='mahasiswa',tab='',sel='',proj=false,pv=[],S={mk:[],mem:[],pes:[],rec:[],set:{toleransi_menit:15},dev:[],ntf:[],wait:null,jp:{}};
const toast=m=>{const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),4200)};
const dlg=h=>{$('#dg').innerHTML=h;$('#dg').showModal()},cls=()=>$('#dg').close();
const mask=s=>{s=String(s||'');return proj&&s.length>4?s.slice(0,-3)+'***':s};
const maskUid=u=>u?u.slice(0,2)+'••••'+u.slice(-2):'';
const nm=id=>(S.mem.find(a=>a.id==id)||{}).nama||'-',MKo=id=>S.mk.find(k=>k.id==id)||{};
const tol=k=>k.toleransi_menit??S.set.toleransi_menit;
const badge=s=>`<span class="b ${s=='Hadir'?'ok':s=='Terlambat'?'lt':s=='Belum'?'er':''}">${esc(s)}</span>`;
const kpi=(a,b)=>`<div class="kpi"><span>${a}</span><b>${b}</b></div>`;
const myMk=()=>S.mk.filter(k=>S.pes.some(p=>p.anggota_id==me.id&&p.mata_kuliah_id==k.id));
const ampu=()=>S.mk.filter(k=>k.dosen_id==me.id);

/* ---------- 2 Tampilan Gerbang: Masuk (Login) vs Daftar Awal ---------- */
function setGateMode(m,msg){gateMode=m;gate(msg)}
function pickRole(r){wantRole=r;document.querySelectorAll('.rbtn').forEach(b=>b.classList.toggle('on',b.dataset.r==r))}
const waHelpHtml=`<div id="wa-help" class="info-wa"><b>Nomor WhatsApp wajib diisi untuk melanjutkan pendaftaran:</b><ul>
<li><b>Pengingat Tepat Waktu:</b> Mengirim pesan otomatis tepat saat jam kuliah dimulai jika Anda belum <i>tap</i> kartu RFID agar tidak tercatat terlambat.</li>
<li><b>Info Kelas (Khusus Dosen):</b> Mengirim ringkasan jumlah mahasiswa yang sudah hadir saat kelas dimulai.</li>
<li><b>Anti-Spam (Maks. 1x):</b> Hanya dikirim 1 kali per mata kuliah dan tidak akan mengirim pesan jika Anda sudah <i>tap</i> kartu atau sudah melewati jam mulai.</li>
</ul></div>`;

function gate(msg){
 const R=[['mahasiswa','Mahasiswa','Kartu & rekap'],['dosen','Dosen','Kelas & koreksi'],['admin','Admin','Kelola sistem']];
 const isLogin=gateMode=='login';
 $('#app').innerHTML=`<div class="gate"><div class="card">
 <h2 style="color:var(--dk);margin-bottom:2px">Presensi RFID <span style="color:var(--gd)">Polnes</span></h2>
 <p class="mut" style="margin-top:0;margin-bottom:14px">Prodi TRK · Politeknik Negeri Samarinda</p>
 <div class="gtabs">
   <button type="button" class="${isLogin?'on':''}" onclick="setGateMode('login')">Masuk (Login)</button>
   <button type="button" class="${!isLogin?'on':''}" onclick="setGateMode('daftar')">Daftar Awal</button>
 </div>
 ${msg?`<p style="color:var(--er);font-weight:600;margin-top:0">${esc(msg)}</p>`:''}
 ${isLogin?`
   <div class="ac" style="justify-content:stretch;margin-top:4px"><button class="p" style="width:100%;padding:10px" onclick="loginGoogle()">Masuk dengan Google</button></div>
   <hr style="border:0;border-top:1px solid var(--ln);margin:14px 0">
   <label style="margin-top:0">Email<input id="em" type="email" autocomplete="username" placeholder="nama@gmail.com"></label>
   <label>Kata sandi<input id="pw" type="password" autocomplete="current-password"></label>
   <div class="ac"><button style="width:100%" onclick="loginEmail()">Masuk dengan Email</button></div>
   <div class="gfoot">Belum pernah aktivasi akun? <a onclick="setGateMode('daftar')">Daftar awal di sini</a></div>
 `:`
   <label style="margin-top:0">1. Pilih peran Anda</label>
   <div class="roles">${R.map(([k,t,s])=>`<button type="button" class="rbtn ${wantRole==k?'on':''}" data-r="${k}" onclick="pickRole('${k}')"><b>${t}</b><small>${s}</small></button>`).join('')}</div>
   <label>2. Nomor WhatsApp aktif (08… otomatis jadi 628…)<input id="wa" inputmode="tel" placeholder="081234567890" oninput="this.classList.remove('inp-err')"></label>
   ${waHelpHtml}
   <label>3. Hubungkan akun terdaftar</label>
   <div class="ac" style="justify-content:stretch;margin-top:6px"><button class="p" style="width:100%;padding:10px" onclick="daftarGoogle()">Daftar dengan Google (Gmail)</button></div>
   <hr style="border:0;border-top:1px solid var(--ln);margin:14px 0">
   <label style="margin-top:0">Atau daftar dengan email &amp; kata sandi<input id="em" type="email" autocomplete="username" placeholder="nama@gmail.com"></label>
   <label>Buat kata sandi<input id="pw" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter"></label>
   <div class="ac"><button style="width:100%" onclick="daftarEmail()">Daftar dengan Email</button></div>
   <div class="gfoot">Sudah pernah mendaftar sebelumnya? <a onclick="setGateMode('login')">Masuk di sini</a></div>
 `}</div></div>`}

/* Layar lanjutan jika user baru langsung klik Masuk tanpa lewat Daftar Awal */
function completeOnboarding(email,msg){
 const R=[['mahasiswa','Mahasiswa','Kartu & rekap'],['dosen','Dosen','Kelas & koreksi'],['admin','Admin','Kelola sistem']];
 $('#app').innerHTML=`<div class="gate"><div class="card">
 <h2 style="color:var(--dk);margin-bottom:2px">Lengkapi Aktivasi Akun</h2>
 <p class="mut" style="margin-top:0">Login sebagai <b>${esc(email)}</b>. Pilih peran dan isi nomor WhatsApp untuk mengaktifkan notifikasi kelas.</p>
 ${msg?`<p style="color:var(--er);font-weight:600">${esc(msg)}</p>`:''}
 <label>1. Pilih peran Anda</label>
 <div class="roles">${R.map(([k,t,s])=>`<button type="button" class="rbtn ${wantRole==k?'on':''}" data-r="${k}" onclick="pickRole('${k}')"><b>${t}</b><small>${s}</small></button>`).join('')}</div>
 <label>2. Nomor WhatsApp aktif<input id="wa" inputmode="tel" placeholder="081234567890" oninput="this.classList.remove('inp-err')"></label>
 ${waHelpHtml}
 <div class="ac"><button onclick="logout()">Batal</button><button class="p" onclick="finishOnboarding()">Simpan &amp; Lanjutkan</button></div>
 </div></div>`}

function checkDaftarWa(){
 const inp=$('#wa'),w=normWa(inp?.value);
 if(!w){
  inp?.classList.add('inp-err');
  $('#wa-help')?.classList.add('show');
  inp?.focus();
  return null;
 }
 return w;
}

async function loginGoogle(){
 localStorage.setItem('authMode','login');
 localStorage.removeItem('wantRole');
 localStorage.removeItem('wa');
 const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
 if(error)toast(error.message);
}
async function loginEmail(){
 localStorage.setItem('authMode','login');
 localStorage.removeItem('wantRole');
 localStorage.removeItem('wa');
 const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
 if(error)return toast(error.message);
 boot();
}
async function daftarGoogle(){
 const w=checkDaftarWa();if(!w)return;
 localStorage.setItem('authMode','daftar');
 localStorage.setItem('wantRole',wantRole);
 localStorage.setItem('wa',w);
 const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
 if(error)toast(error.message);
}
async function daftarEmail(){
 const w=checkDaftarWa();if(!w)return;
 const email=$('#em').value.trim(),password=$('#pw').value;
 if(!email||password.length<6)return toast('Masukkan email valid dan sandi minimal 6 karakter');
 localStorage.setItem('authMode','daftar');
 localStorage.setItem('wantRole',wantRole);
 localStorage.setItem('wa',w);
 let {data,error}=await sb.auth.signUp({email,password});
 if(error&&/already registered/i.test(error.message)){
  const r=await sb.auth.signInWithPassword({email,password});
  data=r.data;error=r.error;
 }
 if(error)return toast(error.message);
 if(!data?.session)return setGateMode('login','Link konfirmasi telah dikirim ke '+email+'. Cek inbox lalu silakan Masuk.');
 boot();
}
async function finishOnboarding(){
 const w=checkDaftarWa();if(!w)return;
 localStorage.setItem('authMode','daftar');
 localStorage.setItem('wantRole',wantRole);
 localStorage.setItem('wa',w);
 boot();
}
async function logout(){
 await sb.auth.signOut();
 localStorage.removeItem('authMode');localStorage.removeItem('wantRole');localStorage.removeItem('wa');
 me=null;role='';gateMode='login';gate();
}
async function boot(){
 const {data:{session}}=await sb.auth.getSession();if(!session)return gate();
 const savedWa=localStorage.getItem('wa')||'';
 const authMode=localStorage.getItem('authMode')||'login';
 const chosen=localStorage.getItem('wantRole')||'';
 const {data,error}=await sb.rpc('tautkan_akun',{p_no_wa:savedWa});
 if(error||data?.error){
  const errMsg=error?.message||data.error;
  if(/WhatsApp/i.test(errMsg))return completeOnboarding(session.user?.email||'');
  await sb.auth.signOut();
  return gate(errMsg);
 }
 if(authMode=='daftar'&&chosen&&chosen!==data.peran){
  await sb.auth.signOut();
  return setGateMode('daftar',`Akun ini didaftarkan Admin sebagai ${data.peran.toUpperCase()}, bukan ${chosen.toUpperCase()}. Pilih peran yang sesuai.`);
 }
 localStorage.removeItem('authMode');localStorage.removeItem('wantRole');localStorage.removeItem('wa');
 role=data.peran;await load(data.id);tab=TABS[role][0][0];render();live();
}

/* ---------- Data ---------- */
async function load(id){
 const R=await Promise.all([sb.from('mata_kuliah').select('*').order('kode'),sb.from('anggota').select('*').order('nama'),sb.from('peserta').select('*'),
  sb.from('presensi').select('*').order('tanggal',{ascending:false}).order('masuk',{ascending:false}).limit(3000),sb.from('pengaturan').select('*').limit(1).maybeSingle(),
  sb.from('perangkat').select('id,nama,aktif,terakhir_terlihat')]);
 const e=R.find(r=>r.error);if(e)return toast(e.error.message);
 S.mk=R[0].data;S.mem=R[1].data;S.pes=R[2].data;S.rec=R[3].data;S.set=R[4].data||S.set;S.dev=R[5].data||[];
 if(id)me=S.mem.find(a=>a.id==id)||me;
 if(role=='admin'){const [n,w]=await Promise.all([sb.from('notifikasi_log').select('*').order('dikirim_pada',{ascending:false,nullsFirst:false}).limit(100),
  sb.from('sesi_registrasi').select('*').eq('selesai',false).gt('kedaluwarsa',new Date().toISOString()).order('dibuat_pada',{ascending:false}).limit(1).maybeSingle()]);S.ntf=n.data||[];S.wait=w.data}
 if(role=='mahasiswa'&&me){S.jp={};await Promise.all(myMk().map(async k=>{const {data}=await sb.rpc('jumlah_pertemuan',{p_mk:k.id});S.jp[k.id]=data||0}))}
}
function live(){
 sb.channel('rt').on('postgres_changes',{event:'*',schema:'public',table:'presensi'},()=>refresh()).subscribe();
 setInterval(()=>{if(!/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName)&&!$('#dg').open)refresh()},10000);
 setInterval(()=>{const c=$('#cd');if(c)c.textContent=countdown()},1000)}
async function refresh(){if(!role)return;await load();render()}

/* ---------- Shell ---------- */
const TABS={admin:[['dash','Dashboard'],['mk','Mata Kuliah'],['usr','Pengguna'],['log','Log Presensi'],['ovp','Mode Overpower'],['ntf','Notifikasi'],['xls','Import / Export']],
 dosen:[['kelas','Kelas Saya'],['log','Koreksi Presensi'],['xls','Import / Export']],
 mahasiswa:[['kartu','Kartu Saya'],['stat','Statistik'],['rw','Riwayat'],['wa','WhatsApp']]};
function render(){
 document.body.classList.toggle('proj',proj);
 $('#app').innerHTML=`<div class="app"><aside class="sb"><div class="brand"><b>Presensi RFID</b><small>Polnes · TRK · ${role}</small></div>
 ${TABS[role].map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}<div class="sp"></div>
 <small class="mut2">${esc(me?.nama||'Admin')}</small>${role!='mahasiswa'?`<button onclick="projToggle()">${proj?'Keluar Proyektor':'Mode Proyektor'}</button>`:''}<button onclick="logout()">Keluar</button></aside>
 <main><h2>${TABS[role].find(t=>t[0]==tab)[1]}</h2>${V[tab]()}</main></div>`}
function projToggle(){proj=!proj;if(proj)document.documentElement.requestFullscreen?.().catch(()=>{});else document.fullscreenElement&&document.exitFullscreen();render()}

/* ---------- View ---------- */
const V={
dash(){const t=S.rec.filter(r=>r.tanggal==TD()),d=S.dev.find(x=>x.aktif)||S.dev[0],on=d?.terakhir_terlihat&&Date.now()-new Date(d.terakhir_terlihat)<90000;
 return `<div class="kpis">${kpi('Mahasiswa aktif',S.mem.filter(a=>a.peran=='mahasiswa'&&a.aktif).length)}${kpi('Dosen',S.mem.filter(a=>a.peran=='dosen').length)}${kpi('Hadir hari ini',t.filter(r=>r.status=='Hadir').length)}${kpi('Terlambat',t.filter(r=>r.status=='Terlambat').length)}</div>

async function pick(inp){const f=inp.files[0];if(!f)return;const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});

 const g={};ok.forEach(r=>{const o={nim:r.nim,nama:r.nama,kelas:r.kelas,peran:r.peran,aktif:true};if(r.email)o.email=r.email;if(r.wa)o.no_wa=r.wa;if(r.uid)o.uid_kartu=r.uid;(g[Object.keys(o).join()]??=[]).push(o)});

 toast(ok.length+' baris diimpor');pv=[];refresh()}
function exportXls(){const key={},dates={};S.rec.forEach(r=>{(key[r.mata_kuliah_id+'|'+r.tanggal]??=[]).push(r);(dates[r.mata_kuliah_id]??=new Set()).add(r.tanggal)});
 const c=(a,s)=>a.filter(x=>x.status==s).length;
 const ring=Object.entries(key).map(([k,a])=>{const [m,t]=k.split('|');return {Tanggal:t,Kode:MKo(m).kode,Mata_Kuliah:MKo(m).nama,Peserta:S.pes.filter(p=>p.mata_kuliah_id==m).length,Hadir:c(a,'Hadir'),Terlambat:c(a,'Terlambat'),Izin:c(a,'Izin'),Sakit:c(a,'Sakit')}}).sort((a,b)=>b.Tanggal.localeCompare(a.Tanggal));
 const det=S.rec.map(r=>{const a=S.mem.find(x=>x.id==r.anggota_id)||{};return {Tanggal:r.tanggal,Kode:MKo(r.mata_kuliah_id).kode,NIM:a.nim,Nama:a.nama,Masuk:r.masuk.slice(0,5),Pulang:(r.pulang||'').slice(0,5),Status:r.status,Sumber:r.sumber}});
 const rek=[];S.mk.filter(k=>dates[k.id]).forEach(k=>S.pes.filter(p=>p.mata_kuliah_id==k.id).forEach(p=>{const a=S.mem.find(x=>x.id==p.anggota_id);if(!a)return;const n=dates[k.id].size,h=S.rec.filter(r=>r.anggota_id==a.id&&r.mata_kuliah_id==k.id&&['Hadir','Terlambat'].includes(r.status)).length;rek.push({Kode:k.kode,NIM:a.nim,Nama:a.nama,Pertemuan:n,Hadir:h,Persen_Kehadiran:Math.round(h/n*100)})}));
 const wb=XLSX.utils.book_new();[['Ringkasan_Sesi',ring],['Log_Presensi_Detail',det],['Rekap_Persentase_Kehadiran',rek]].forEach(([n,d])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d),n));XLSX.writeFile(wb,'presensi-polnes-'+TD()+'.xlsx')}

sb.auth.onAuthStateChange((e)=>{if(e=='SIGNED_OUT'){role='';me=null}});
boot();
